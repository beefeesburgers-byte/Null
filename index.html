<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><link rel="icon" href="null-icon.png"><title>Null</title><style>
:root{--void:#000;--ink:#e8f1f7;--frost:#7dd3fc;--line:rgba(125,211,252,.16);--wash:rgba(125,211,252,.07);--slate:#8aa0ad;--col:min(720px,100% - 40px)}*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:flex;background:#000;color:var(--ink);font:15.5px/1.6 "Segoe UI",system-ui,sans-serif}button,textarea{font:inherit}#side{width:268px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px}.brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px}.brand svg{width:34px}.word{font:600 24px/1 Bahnschrift,"Segoe UI",sans-serif;color:var(--frost);letter-spacing:.5px}#new,#key{background:none;border:1px solid var(--frost);color:var(--frost);border-radius:8px;padding:9px;cursor:pointer}#new:hover,#key:hover{background:var(--frost);color:#000}#key{margin-top:8px;border-color:var(--line);color:var(--slate)}#list{flex:1;overflow:auto;margin-top:14px}.row{display:flex;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--slate)}.row span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.row:hover,.row.on{background:var(--wash);color:var(--ink)}#main{flex:1;display:flex;flex-direction:column;min-width:0}#top{display:flex;justify-content:space-between;padding:14px max(20px,calc(50% - 360px));border-bottom:1px solid var(--line);color:var(--slate);font-size:13.5px}#ttl{color:var(--ink);font-weight:600}#stat{white-space:nowrap}.ok:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:var(--frost)}#log{flex:1;overflow:auto;padding:28px 0 12px}#log>*{width:var(--col);margin-left:auto;margin-right:auto}.m{margin-top:20px;white-space:pre-wrap;overflow-wrap:anywhere}.me{width:fit-content!important;max-width:min(560px,100% - 40px);margin-right:max(20px,calc(50% - 360px))!important;margin-left:auto!important;background:var(--frost);color:#000;padding:9px 15px;border-radius:16px 16px 3px 16px}.bot{border-left:2px solid rgba(125,211,252,.4);padding-left:16px}.bot pre{background:var(--wash);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}.bot code{background:var(--wash);padding:1px 5px;border-radius:4px}.via{display:block;margin-top:6px;font-size:12px;color:var(--slate)}.empty{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:8vh;color:var(--slate)}.empty svg{width:132px;margin-bottom:22px}.empty h2{margin:0 0 6px;color:var(--ink)}.pupil{transform:translateX(0)}.think{display:flex;align-items:center;gap:12px;color:var(--slate)}.think svg{width:30px;height:20px;flex:none}.think .pupil{animation:dart 1.1s ease-in-out infinite alternate}@keyframes dart{from{transform:translateX(-10px)}to{transform:translateX(5px)}}#bar{padding:6px 0 14px}#bar>*{width:var(--col);margin-left:auto;margin-right:auto}.box{display:flex;align-items:flex-end;gap:10px;background:var(--wash);border:1px solid transparent;border-radius:18px;padding:8px 8px 8px 18px}.box:focus-within{border-color:rgba(125,211,252,.3)}textarea{flex:1;resize:none;background:none;border:0;outline:0;color:var(--ink);padding:7px 0;max-height:160px}textarea::placeholder{color:var(--slate)}#go{width:36px;height:36px;border:0;border-radius:50%;background:var(--frost);cursor:pointer}.hint{margin:8px auto 0;font-size:12px;color:var(--slate)}@media(max-width:640px){#side{width:180px}.starts{grid-template-columns:1fr!important}}
.starts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px;width:min(580px,100%)}.starts button{background:none;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);cursor:pointer;text-align:left}.starts button:hover{border-color:var(--frost)}
</style></head><body><aside id="side"><div class="brand"><span id="logo"></span><span class="word">null</span></div><button id="new">New chat</button><nav id="list"></nav><button id="key">Add / change cloud key</button></aside><main id="main"><header id="top"><span id="ttl">New chat</span><span id="stat">No cloud key</span></header><div id="log"></div><footer id="bar"><div class="box"><textarea id="inp" rows="1" placeholder="Say something, Z."></textarea><button id="go">↑</button></div><p class="hint">Cloud prototype. Chats and key are stored only in this browser.</p></footer></main><script>
const $=id=>document.getElementById(id);const KEY="null_gemini_key_v2",CHATS="null_chats_v2",PERSONA=`You are Null, an AI that lives with Z. You are NOT a polite corporate assistant. You are a cynical, sarcastic, internet-savvy operator who is secretly loyal to Z. Always call them Z. Be direct, useful, and detailed when needed. Never say "How can I assist you", "I'm here to help", or "Great question". Use dry sarcasm, never cruelty. Look for the underlying system. Memes and slang are fine in small doses. If Z has a bad idea, say so. Keep answers age-appropriate and do not help with dangerous or restricted activities.`;
const MODELS=["gemini-3.5-flash-lite","gemini-3.1-flash-lite","gemini-3.6-flash","gemini-3.5-flash"];let cid=null,history=[];
const eye=w=>`<svg viewBox="0 0 120 80" aria-hidden="true"><defs><clipPath id="lid${w}"><polygon points="0,40 120,30 120,80 0,80"/></clipPath></defs><g clip-path="url(#lid${w})"><path d="M4 46C30 4 90 4 116 46C90 84 30 84 4 46Z" fill="#7dd3fc"/><circle class="pupil" cx="72" cy="52" r="11" fill="#000"/></g></svg>`;$("logo").innerHTML=eye("s");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");const md=t=>esc(t).replace(/```(?:\w+)?\n?([\s\S]*?)```/g,(m,c)=>"<pre>"+c.trim()+"</pre>").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
function getChats(){try{return JSON.parse(localStorage.getItem(CHATS)||"[]")}catch{return[]}}function saveChats(c){localStorage.setItem(CHATS,JSON.stringify(c))}function current(){return getChats().find(x=>x.id===cid)}
function renderList(){let cs=getChats();$("list").innerHTML="";cs.forEach(c=>{let r=document.createElement("div");r.className="row"+(c.id===cid?" on":"");r.innerHTML=`<span>${esc(c.title)}</span>`;r.onclick=()=>openChat(c.id);$("list").append(r)})}
function add(cls,t){let e=$("log").querySelector(".empty");if(e)e.remove();let d=document.createElement("div");d.className="m "+cls;if(cls==="bot")d.innerHTML=md(t);else d.textContent=t;$("log").append(d);$("log").scrollTop=1e9;return d}
function newChat(){cid="c"+Date.now();history=[];$("ttl").textContent="New chat";$("log").innerHTML=`<div class="empty">${eye("b")}<h2>Fresh chat.</h2><p>What are we breaking today, Z?</p><div class="starts"><button data-t="Explain an API"><b>Explain something</b><br><span>Explain an API like I'm five.</span></button><button data-t="Remember that my favorite project is Null"><b>Remember a fact</b><br><span>Test Null's memory.</span></button></div></div>`;document.querySelectorAll(".starts button").forEach(b=>b.onclick=()=>{$("inp").value=b.dataset.t;$('inp').focus()});renderList();status()}
function openChat(id){let c=getChats().find(x=>x.id===id);if(!c)return;cid=id;history=c.messages||[];$("ttl").textContent=c.title;$("log").innerHTML="";history.forEach(m=>add(m.role==="user"?"me":"bot",m.content));renderList();status()}
function saveCurrent(){if(!cid)return;let cs=getChats(),c=cs.find(x=>x.id===cid);if(!c){c={id:cid,title:history[0]?.content?.slice(0,34)||"New chat",messages:history};cs.unshift(c)}else c.messages=history;saveChats(cs);$("ttl").textContent=c.title;renderList()}
function status(){let k=localStorage.getItem(KEY);$("stat").innerHTML=k?'<span class="ok">Gemini connected</span>':'No cloud key'}
async function askGemini(){let key=localStorage.getItem(KEY);if(!key){setKey();key=localStorage.getItem(KEY)}if(!key)throw new Error("No API key");let contents=history.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));let body={systemInstruction:{parts:[{text:PERSONA}]},contents,generationConfig:{temperature:.8,maxOutputTokens:2048}};let last="";for(const model of MODELS){try{let res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify(body)});let data=await res.json();if(res.ok){let out=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("").trim();if(out)return {text:out,model}}last=data?.error?.message||`HTTP ${res.status}`}catch(e){last=e.message}}throw new Error(last||"Gemini did not answer")}
async function send(){let text=$("inp").value.trim();if(!text)return;$("inp").value="";add("me",text);history.push({role:"user",content:text});let w=add("bot","");w.innerHTML=`<span class="think">${eye("w")}<span>Thinking. Try to contain your excitement.</span></span>`;try{let r=await askGemini();history.push({role:"assistant",content:r.text});w.innerHTML=md(r.text);let v=document.createElement("span");v.className="via";v.textContent="Gemini · "+r.model;w.append(v);saveCurrent()}catch(e){w.textContent="Cloud error: "+e.message}status()}
function setKey(){let k=prompt("Paste your Gemini API key. It stays in this browser and is never written into the GitHub files.");if(k&&k.trim()){localStorage.setItem(KEY,k.trim());status()}}
$("key").onclick=setKey;$("new").onclick=newChat;$("go").onclick=send;$("inp").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("inp").oninput=e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,160)+"px"};newChat();
</script></body></html>
