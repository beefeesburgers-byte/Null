<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Null</title><link rel="icon" href="null-icon.png">
<style>
:root{--void:#000;--ink:#e8f1f7;--frost:#7dd3fc;--line:rgba(125,211,252,.16);--wash:rgba(125,211,252,.07);--slate:#8aa0ad}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#000;color:var(--ink);font:15.5px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex}
button,textarea,input{font:inherit}button{cursor:pointer}.side{width:250px;flex:none;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px}.brand svg{width:34px;height:28px}.word{font-weight:700;font-size:24px;color:var(--frost);letter-spacing:.5px}.new{background:none;border:1px solid var(--frost);color:var(--frost);border-radius:8px;padding:9px;font-weight:600}.new:hover{background:var(--frost);color:#000}.list{flex:1;overflow:auto;margin-top:14px}.chatrow{padding:9px 10px;border-radius:7px;color:var(--slate);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chatrow:hover,.chatrow.on{background:var(--wash);color:var(--ink)}.bottom{display:grid;gap:7px}.bottom button{background:none;border:0;color:var(--slate);text-align:left;padding:8px}.bottom button:hover{color:var(--frost)}main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc(50% - 360px));color:var(--slate);font-size:13px}.title{color:var(--ink);font-weight:650;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stat{white-space:nowrap}.log{flex:1;overflow:auto;padding:26px 0 12px}.log>*{width:min(720px,calc(100% - 36px));margin-left:auto;margin-right:auto}.empty{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:8vh;color:var(--slate)}.empty svg{width:150px;margin-bottom:20px}.empty h1{margin:0 0 5px;color:var(--ink);font-size:27px}.empty p{margin:0}.m{margin-top:18px;white-space:pre-wrap;overflow-wrap:anywhere}.me{width:fit-content!important;max-width:min(560px,calc(100% - 36px));margin-right:max(18px,calc(50% - 360px))!important;margin-left:auto!important;background:var(--frost);color:#000;padding:9px 15px;border-radius:16px 16px 3px 16px}.bot{border-left:2px solid rgba(125,211,252,.4);padding-left:15px}.bot code{background:var(--wash);padding:1px 5px;border-radius:4px}.bot pre{background:var(--wash);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}.think{border-left:2px solid rgba(125,211,252,.25);padding-left:15px;color:var(--slate)}.think .pupil{animation:dart 1.1s ease-in-out infinite alternate}@keyframes dart{from{transform:translateX(-25px)}to{transform:translateX(12px)}}.bar{padding:7px 0 15px}.bar>*{width:min(720px,calc(100% - 36px));margin:auto}.box{display:flex;align-items:flex-end;gap:10px;background:var(--wash);border:1px solid transparent;border-radius:18px;padding:8px 8px 8px 18px}.box:focus-within{border-color:rgba(125,211,252,.3)}textarea{flex:1;resize:none;background:none;border:0;outline:0;color:var(--ink);max-height:170px;padding:7px 0}.go{width:36px;height:36px;border:0;border-radius:50%;background:var(--frost);display:grid;place-items:center}.hint{font-size:12px;color:var(--slate);margin:7px auto 0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.card{width:min(440px,100%);background:#07090a;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 20px 70px #000}.card h2{margin:0 0 6px;color:var(--frost)}.card p{color:var(--slate);font-size:13px}.card input{width:100%;background:#000;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:11px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.actions button{padding:8px 14px;border-radius:8px;border:1px solid var(--frost);background:var(--frost);color:#000;font-weight:650}.actions .cancel{background:none;color:var(--frost)}@media(max-width:650px){.side{width:58px;padding:14px 8px}.word,.new,.list,.bottom button span{display:none}.brand{justify-content:center}.bottom{margin-top:auto}.log>*{width:calc(100% - 28px)}.top{padding:0 14px}.bar>*{width:calc(100% - 28px)}}
</style></head>
<body>
<aside class="side"><div class="brand"><span id="logo"></span><span class="word">null</span></div><button class="new" onclick="newChat()">New chat</button><nav class="list" id="list"></nav><div class="bottom"><button onclick="openKey()">🔑 <span>Gemini key</span></button><button onclick="clearAll()">♻ <span>Clear local data</span></button></div></aside>
<main><header class="top"><span class="title" id="title">New chat</span><span class="stat" id="stat">Cloud offline</span></header><div class="log" id="log"></div><footer class="bar"><div class="box"><textarea id="inp" rows="1" placeholder="Say something, Z."></textarea><button class="go" onclick="send()" aria-label="Send"><svg viewBox="0 0 20 20" width="18"><path d="M10 16V4M4.5 9.5L10 4l5.5 5.5" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><p class="hint">/remember saves a fact · /forget removes one · your chats stay in this browser</p></footer></main>
<div class="modal" id="modal"><div class="card"><h2>Connect Null</h2><p>Paste your Gemini API key. For this prototype it is stored only in this browser. Do not publish this key or put it into the GitHub code.</p><input id="keyinput" type="password" placeholder="Gemini API key"><div class="actions"><button class="cancel" onclick="closeKey()">Cancel</button><button onclick="saveKey()">Save</button></div></div></div>
<script>
const MODEL='gemini-3.8-flash';const $=id=>document.getElementById(id);let key=localStorage.getItem('null_gemini_key')||'';let chats=JSON.parse(localStorage.getItem('null_chats')||'[]');let cid=localStorage.getItem('null_current_chat')||'';let memory=JSON.parse(localStorage.getItem('null_memory')||'[]');
function eye(){return `<svg viewBox="0 0 120 80"><defs><clipPath id="lid"><polygon points="0,40 120,30 120,80 0,80"/></clipPath></defs><g clip-path="url(#lid)"><path d="M4 46C30 4 90 4 116 46C90 84 30 84 4 46Z" fill="#7dd3fc"/><circle class="pupil" cx="72" cy="52" r="11" fill="#000"/></g></svg>`} $('logo').innerHTML=eye();
function save(){localStorage.setItem('null_chats',JSON.stringify(chats));localStorage.setItem('null_current_chat',cid);localStorage.setItem('null_memory',JSON.stringify(memory))}
function newChat(){cid='c'+Date.now();chats.unshift({id:cid,title:'New chat',messages:[]});save();render()}
function current(){return chats.find(c=>c.id===cid)}
function render(){if(!current())newChat();const c=current();$('title').textContent=c.title;$('stat').textContent=key?'● Cloud ready':'○ Add Gemini key';$('list').innerHTML=chats.map(x=>`<div class="chatrow ${x.id===cid?'on':''}" onclick="openChat('${x.id}')">${esc(x.title)}</div>`).join('');$('log').innerHTML=c.messages.length?c.messages.map(m=>msgHTML(m)).join(''):`<div class="empty">${eye()}<h1>NULL</h1><p>Cloud brain offline until you give me a Gemini key.<br>Humanity survives another minute.</p></div>`;$('log').scrollTop=1e9}
function openChat(id){cid=id;save();render()}
function msgHTML(m){return `<div class="m ${m.role==='user'?'me':'bot'}">${m.role==='user'?esc(m.text):md(m.text)}</div>`}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(t){return esc(t).replace(/```(?:\w+)?\n?([\s\S]*?)```/g,(_,c)=>'<pre>'+c.trim()+'</pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')}
function openKey(){$('keyinput').value=key;$('modal').classList.add('show');setTimeout(()=>$('keyinput').focus(),50)}function closeKey(){$('modal').classList.remove('show')}function saveKey(){key=$('keyinput').value.trim();if(key)localStorage.setItem('null_gemini_key',key);else localStorage.removeItem('null_gemini_key');closeKey();render()}
function clearAll(){if(confirm('Clear Null chats and memory from this browser?')){localStorage.clear();location.reload()}}
function add(role,text){current().messages.push({role,text});save();render()}
function system(){return `You are Null, a male AI assistant built for Z. Your personality: cynical, witty, internet-aware, sarcastic but genuinely loyal. You are not cruel. You call the user Z or Boss when natural. You are concise unless detail is useful. Never claim to have abilities you do not have. You are a cloud assistant, not a local computer controller. Do not invent memories. Long-term memory available to you: ${memory.length?memory.join(' | '):'none yet'}`}
async function gemini(history){const contents=history.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.text}]}));const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:system()}]},contents,generationConfig:{temperature:.9,maxOutputTokens:1200}})});const data=await res.json();if(!res.ok)throw new Error(data?.error?.message||'Gemini request failed');return data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'Null received an empty response.'}
async function send(){const input=$('inp'),text=input.value.trim();if(!text)return;if(!key){openKey();return}if(!current())newChat();if(/^\/remember\s+/i.test(text)){const f=text.replace(/^\/remember\s+/i,'').trim();if(f){memory.push(f);save();add('assistant',`Noted. Saved to Scribe-lite memory: “${f}”`)}input.value='';return}if(/^\/forget\s+/i.test(text)){const q=text.replace(/^\/forget\s+/i,'').toLowerCase();const before=memory.length;memory=memory.filter(x=>!x.toLowerCase().includes(q));save();add('assistant',`Forgot ${before-memory.length} memory item(s) matching “${q}”.`);input.value='';return}add('user',text);input.value='';const c=current();if(c.title==='New chat')c.title=text.slice(0,42);render();const think=document.createElement('div');think.className='m think';think.innerHTML=eye()+' Thinking. Try to contain your excitement.';$('log').append(think);$('log').scrollTop=1e9;try{const reply=await gemini(c.messages);c.messages.push({role:'assistant',text:reply});save();render()}catch(e){c.messages.push({role:'assistant',text:'Cloud error: '+e.message});save();render()}}
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});newChat();render();
</script></body></html>
